<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlante | La mia lista</title>
  <meta name="description" content="Le destinazioni che vuoi visitare, con il meteo in tempo reale e le mete già spuntate.">
  <meta name="keywords" content="lista viaggi, destinazioni salvate, meteo, viaggi">
  <meta name="author" content="Massimiliano Longo">
  <meta name="theme-color" content="#12303F">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
  <script src="js/wishlist.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Vai al contenuto</a>

  <header>
    <nav aria-label="Menu principale">
      <a class="logo" href="index.html">Atlante</a>
      <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="menu">Menu</button>
      <ul id="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Cerca</a></li>
        <li><a href="wishlist.html">La mia lista</a></li>
        <li><a href="contact.html">Contatti</a></li>
        <li data-auth="guest"><a href="login.html">Accedi</a></li>
        <li data-auth="user" hidden><a href="profile.html" id="greeting">Profilo</a></li>
        <li data-auth="user" hidden><button type="button" id="logout">Esci</button></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>La mia lista</h1>
    <p id="guest-message" hidden>Per vedere la tua lista devi <a href="login.html">accedere</a>.</p>

    <div id="tools" hidden>
      <p id="summary"></p>
      <div class="row" role="group" aria-label="Filtra le destinazioni">
        <button type="button" class="secondary" data-filter="all" aria-pressed="true">Tutte</button>
        <button type="button" class="secondary" data-filter="to-visit" aria-pressed="false">Da visitare</button>
        <button type="button" class="secondary" data-filter="visited" aria-pressed="false">Visitate</button>
      </div>
    </div>

    <p id="status" role="status"></p>
    <ul id="destinations" class="cards"></ul>

    <template id="destination-card">
      <li>
        <article class="card">
          <header>
            <img alt="">
            <div>
              <h2></h2>
              <p data-field="place"></p>
            </div>
          </header>
          <p>Meteo ora: <span data-field="weather">in aggiornamento</span></p>
          <p>Salvata il: <span data-field="date"></span></p>
          <label><input type="checkbox"> Già visitata</label>
          <button type="button" class="secondary">Rimuovi</button>
        </article>
      </li>
    </template>
  </main>

  <footer>
    <p>Atlante è un progetto didattico realizzato con HTML, CSS e JavaScript. Dati meteo e geografici di <a href="https://open-meteo.com/">Open-Meteo</a>.</p>
  </footer>
</body>
</html>
